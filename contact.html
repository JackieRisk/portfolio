  <main>

    <div class="page-header wrap">
      <span class="eyebrow">Contact</span>
      <h1>Let's talk</h1>
      <p class="hero-summary">The best way to reach me is via the form below, or connect on <a href="https://www.linkedin.com/in/jacqueline-risk/" target="_blank" rel="noopener">LinkedIn ↗</a>.</p>
    </div>

    <section class="contact wrap">
      <form class="contact-form" action="https://formspree.io/f/mojglkwr" method="POST">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="_replyto" required>

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" required></textarea>

        <button type="submit" class="btn btn-primary">Send</button>
      </form>
    </section>

  </main>
