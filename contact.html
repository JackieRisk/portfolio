<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jackie Risk | Contact</title>
  <meta name="description" content="Get in touch with Jackie Risk, Senior Product Designer.">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="wrap">
      <a href="index.html" class="logo">Jackie Risk</a>
      <button class="nav-toggle" aria-expanded="false" aria-controls="primary-nav" aria-label="Toggle navigation menu">
        <span></span><span></span><span></span>
      </button>
      <nav aria-label="Primary" id="primary-nav" class="site-nav">
        <a href="work.html">Work</a>
        <a href="about.html">About</a>
        <a href="contact.html" aria-current="page">Contact</a>
      </nav>
    </div>
  </header>

  <main>

    <div class="page-header wrap">
      <span class="eyebrow">Contact</span>
      <h1>Let's talk</h1>
      <p class="hero-summary">The best way to reach me is via the form below, or connect on <a href="https://www.linkedin.com/in/jacqueline-risk/" target="_blank" rel="noopener">LinkedIn ↗</a>.</p>
    </div>

    <section class="contact wrap">
      <form class="contact-form" action="https://formspree.io/f/mojglkwr" method="POST">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="_replyto" required>

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" required></textarea>

        <button type="submit" class="btn btn-primary">Send</button>
      </form>
    </section>

  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>&copy; 2026 Jackie Risk</p>
    </div>
  </footer>

  <script src="assets/js/main.js"></script>
</body>
</html>
